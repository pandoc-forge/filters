name: Build

on:
  push:
    branches: [main]
    # A tag <package>-v<version>, or <package>-v<version>-<build> for build
    # number > 0, releases that one package to the release channel.
    tags: ['*-v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DEV_CHANNEL: ${{ vars.PREFIX_DEV_CHANNEL || 'pandoc-forge/dev' }}
  RELEASE_CHANNEL: ${{ vars.PREFIX_RELEASE_CHANNEL || 'pandoc-forge' }}

jobs:
  # Filters are noarch, so one Linux job builds them all. Each test runs
  # upstream's own suite against pandoc-forge's pandoc from the dev channel.
  build:
    if: github.ref_type != 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          locked: true

      - name: Check recipes match filters.yaml and upstream
        run: pixi run check

      - name: Build
        run: pixi run build "$DEV_CHANNEL"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: conda-noarch
          path: output/noarch/*.conda
          if-no-files-found: ignore

  # Separate from the build, so that upstream test code never runs with a
  # token that can publish.
  upload-dev:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # trusted publishing to prefix.dev
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/download-artifact@v8.0.1
        with:
          name: conda-noarch
          path: packages
        continue-on-error: true # nothing new was built

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          locked: true

      - name: Upload to prefix.dev
        run: |
          mapfile -d '' pkgs < <(find packages -name '*.conda' -print0 2>/dev/null)
          if (( ${#pkgs[@]} == 0 )); then
            echo "::notice::Nothing new to upload"
            exit 0
          fi
          printf '%s\n' "${pkgs[@]}"
          pixi run rattler-build upload prefix --channel "$DEV_CHANNEL" --skip-existing "${pkgs[@]}"

  # A release tag builds and tests its package again, against pandoc from the
  # release channel, and fails unless the recipe's version and build number
  # are the tag's.
  build-release:
    if: github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          locked: true

      - name: Check recipes match filters.yaml and upstream
        run: pixi run check

      - name: Build
        env:
          TAG: ${{ github.ref_name }}
        run: |
          pkg=${TAG%-v*}
          ver=${TAG##*-v}
          build=0
          if [[ $ver == *-* ]]; then
            build=${ver##*-}
            ver=${ver%-*}
          fi
          if [[ ! -f recipes/$pkg/recipe.yaml ]]; then
            echo "::error::No recipe for $pkg (from tag $TAG)"
            exit 1
          fi
          pixi run rattler-build build --recipe "recipes/$pkg" --variant-config variants.yaml \
            -c "https://prefix.dev/$RELEASE_CHANNEL" -c conda-forge --output-dir output
          want=output/noarch/$pkg-$ver-pandoc_forge_$build.conda
          if [[ ! -f $want ]]; then
            echo "::error::Tag $TAG wants $want, but the recipe built:"
            ls output/noarch
            exit 1
          fi

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: conda-release
          path: output/noarch/*.conda

  # prefix.dev only trusts this job's token for the release channel because
  # it runs in the `release` environment, which only admits release tags.
  upload-release:
    needs: build-release
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: read
      id-token: write # trusted publishing to prefix.dev
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/download-artifact@v8.0.1
        with:
          name: conda-release
          path: packages

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          locked: true

      - name: Upload to prefix.dev
        run: |
          mapfile -d '' pkgs < <(find packages -name '*.conda' -print0)
          printf '%s\n' "${pkgs[@]}"
          pixi run rattler-build upload prefix --channel "$RELEASE_CHANNEL" --skip-existing "${pkgs[@]}"
