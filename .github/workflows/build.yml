name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DEV_CHANNEL: ${{ vars.PREFIX_DEV_CHANNEL || 'pandoc-forge/dev' }}

jobs:
  # Filters are noarch, so one Linux job builds them all. Each test runs
  # upstream's own suite against pandoc-forge's pandoc from the dev channel.
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          locked: true

      - name: Check recipes match filters.yaml and upstream
        run: pixi run check

      - name: Build
        run: pixi run build "$DEV_CHANNEL"

      - uses: actions/upload-artifact@v7.0.1
        with:
          name: conda-noarch
          path: output/noarch/*.conda
          if-no-files-found: ignore

  # Separate from the build, so that upstream test code never runs with a
  # token that can publish.
  upload-dev:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # trusted publishing to prefix.dev
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: actions/download-artifact@v8.0.1
        with:
          name: conda-noarch
          path: packages
        continue-on-error: true # nothing new was built

      - uses: prefix-dev/setup-pixi@v0.10.2
        with:
          locked: true

      - name: Upload to prefix.dev
        run: |
          mapfile -d '' pkgs < <(find packages -name '*.conda' -print0 2>/dev/null)
          if (( ${#pkgs[@]} == 0 )); then
            echo "::notice::Nothing new to upload"
            exit 0
          fi
          printf '%s\n' "${pkgs[@]}"
          pixi run rattler-build upload prefix --channel "$DEV_CHANNEL" --skip-existing "${pkgs[@]}"
