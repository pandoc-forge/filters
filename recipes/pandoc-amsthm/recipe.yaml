context:
  version: "3.1.1"
  build_number: 0

package:
  name: pandoc-amsthm
  version: ${{ version }}

source:
  url: https://github.com/ickc/pandoc-amsthm/archive/refs/tags/v3.1.1.tar.gz
  sha256: 37d1267b0cab36571c9987f24b5af91cd6dcc0accfeaa273deb430d1b910dde8

build:
  number: ${{ build_number }}
  noarch: generic
  string: pandoc_forge_${{ build_number }}
  script:
    - mkdir -p $PREFIX/share/pandoc/filters
    - install -m 644 _extensions/amsthm/amsthm.lua $PREFIX/share/pandoc/filters/amsthm.lua

requirements:
  run:
    - pandoc-api ${{ pandoc_api }}.*
  run_constraints:
    - pandoc >=3.1.1
    - pandoc-wasm >=3.1.1

tests:
  - package_contents:
      files:
        - share/pandoc/filters/amsthm.lua
  # Upstream's own suite, against the installed filter.
  - files:
      source:
        - .gitattributes
        - .github/**
        - .gitignore
        - CHANGELOG.md
        - DESIGN.md
        - LICENSE
        - README.md
        - _extensions/**
        - docs/.gitignore
        - docs/_quarto.yml
        - docs/changelog.qmd
        - docs/copyright-year.lua
        - docs/custom.scss
        - docs/design.qmd
        - docs/example/_metadata.yml
        - docs/example-source.lua
        - docs/examples/**
        - docs/examples.qmd
        - docs/include-code.lua
        - docs/index.qmd
        - docs/source.qmd
        - pixi.lock
        - pixi.toml
        - spec/**
        - tests/**
        - tools/**
    requirements:
      run:
        - pandoc
    script:
      - cp $PREFIX/share/pandoc/filters/amsthm.lua _extensions/amsthm/amsthm.lua
      - pandoc lua spec/run.lua

about:
  homepage: https://github.com/ickc/pandoc-amsthm
  repository: https://github.com/ickc/pandoc-amsthm
